<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">CloudOps Asset Manager - Serverless AWS CRUD Architecture</title>
<desc id="desc">AWS architecture showing users and browser dashboard, API Gateway, Lambda CRUD handlers, DynamoDB, IAM, CloudWatch, AWS SAM, and optional S3 and CloudFront frontend hosting.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324d" flood-opacity=".16"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315b88"/></marker>
  <style>
    .title{font:700 42px Arial,sans-serif;fill:#0b2145}.subtitle{font:20px Arial,sans-serif;fill:#536d86;letter-spacing:2px}.panel{fill:#fff;stroke:#b9cfe3;stroke-width:2}.pt{font:700 24px Arial,sans-serif;fill:#102d56}.svc{font:700 20px Arial,sans-serif;fill:#102d56}.txt{font:16px Arial,sans-serif;fill:#536d86}.small{font:14px Arial,sans-serif;fill:#6b8399}.icon{font:700 20px Arial,sans-serif;fill:#fff}.arrow{stroke:#315b88;stroke-width:4;fill:none;marker-end:url(#arrow)}.support{font:700 17px Arial,sans-serif;fill:#fff}.foot{font:14px Arial,sans-serif;fill:#dce9f5}
  </style>
</defs>
<rect width="1600" height="920" fill="#f6f9fc"/>
<text x="800" y="58" text-anchor="middle" class="title">CloudOps Asset Manager – Serverless AWS CRUD Architecture</text>
<text x="800" y="92" text-anchor="middle" class="subtitle">SECURE | SERVERLESS | CRUD | ASSET INVENTORY | OBSERVABLE</text>
<g filter="url(#shadow)"><rect class="panel" x="40" y="140" width="215" height="455" rx="18"/></g>
<text x="148" y="180" text-anchor="middle" class="pt">Users</text><circle cx="148" cy="258" r="48" fill="#2866a6"/><text x="148" y="266" text-anchor="middle" class="icon">USER</text><text x="148" y="338" text-anchor="middle" class="svc">Users / Admins</text><text x="148" y="372" text-anchor="middle" class="txt">Web browser</text><text x="148" y="402" text-anchor="middle" class="txt">Create, view, update</text><text x="148" y="430" text-anchor="middle" class="txt">and delete assets</text>
<g filter="url(#shadow)"><rect class="panel" x="295" y="140" width="270" height="455" rx="18" fill="#f2fbf2"/></g>
<text x="430" y="180" text-anchor="middle" class="pt">Frontend</text><rect x="365" y="220" width="130" height="110" rx="18" fill="#3557cc"/><text x="430" y="266" text-anchor="middle" class="icon">WEB</text><text x="430" y="296" text-anchor="middle" class="icon">DASHBOARD</text><text x="430" y="368" text-anchor="middle" class="svc">Browser UI</text><text x="430" y="400" text-anchor="middle" class="txt">HTML / CSS / JS</text><text x="430" y="428" text-anchor="middle" class="small">Calls REST API over HTTPS</text><rect x="335" y="476" width="190" height="78" rx="12" fill="#eaf4ff" stroke="#8cb9df"/><text x="430" y="505" text-anchor="middle" class="svc" font-size="17">Optional Hosting</text><text x="430" y="532" text-anchor="middle" class="small">Amazon S3 + CloudFront</text>
<g filter="url(#shadow)"><rect class="panel" x="605" y="140" width="370" height="455" rx="18" fill="#fbf4ff"/></g>
<text x="790" y="180" text-anchor="middle" class="pt">API &amp; Compute</text><rect x="650" y="220" width="120" height="110" rx="18" fill="#d72873"/><text x="710" y="266" text-anchor="middle" class="icon">API</text><text x="710" y="296" text-anchor="middle" class="icon">GATEWAY</text><text x="710" y="368" text-anchor="middle" class="svc">Amazon API Gateway</text><text x="710" y="398" text-anchor="middle" class="txt">REST endpoints</text><rect x="810" y="220" width="120" height="110" rx="18" fill="#f07b13"/><text x="870" y="278" text-anchor="middle" class="icon">λ CRUD</text><text x="870" y="368" text-anchor="middle" class="svc">AWS Lambda</text><text x="870" y="398" text-anchor="middle" class="txt">Validation &amp; logic</text><path class="arrow" d="M770 275H800"/><rect x="655" y="455" width="265" height="108" rx="14" fill="#f9f7ff" stroke="#c7b2e8"/><text x="682" y="486" class="txt" font-weight="700">Create</text><text x="755" y="486" class="small">POST /assets</text><text x="682" y="510" class="txt" font-weight="700">Read</text><text x="755" y="510" class="small">GET /assets</text><text x="682" y="534" class="txt" font-weight="700">Update</text><text x="755" y="534" class="small">PUT /assets/{assetId}</text><text x="682" y="558" class="txt" font-weight="700">Delete</text><text x="755" y="558" class="small">DELETE /assets/{assetId}</text>
<g filter="url(#shadow)"><rect class="panel" x="1015" y="140" width="245" height="455" rx="18" fill="#fff9ed"/></g>
<text x="1138" y="180" text-anchor="middle" class="pt">Data</text><rect x="1078" y="220" width="120" height="110" rx="18" fill="#3557cc"/><text x="1138" y="266" text-anchor="middle" class="icon">DYNAMO</text><text x="1138" y="296" text-anchor="middle" class="icon">DB</text><text x="1138" y="368" text-anchor="middle" class="svc">Amazon DynamoDB</text><text x="1138" y="400" text-anchor="middle" class="txt">Asset inventory</text><text x="1138" y="428" text-anchor="middle" class="small">Primary persistence layer</text>
<g filter="url(#shadow)"><rect class="panel" x="1300" y="140" width="260" height="455" rx="18" fill="#effbfb"/></g>
<text x="1430" y="180" text-anchor="middle" class="pt">Security &amp; Ops</text><rect x="1348" y="220" width="105" height="100" rx="16" fill="#dc3150"/><text x="1400" y="279" text-anchor="middle" class="icon">IAM</text><text x="1400" y="355" text-anchor="middle" class="svc">AWS IAM</text><text x="1400" y="382" text-anchor="middle" class="small">Least privilege</text><rect x="1410" y="430" width="105" height="100" rx="16" fill="#d72b7b"/><text x="1462" y="489" text-anchor="middle" class="icon">CW</text><text x="1462" y="565" text-anchor="middle" class="svc">CloudWatch</text>
<path class="arrow" d="M255 278H285"/><path class="arrow" d="M565 278H595"/><path class="arrow" d="M975 278H1005"/><path class="arrow" d="M1260 278H1290"/>
<g filter="url(#shadow)"><rect x="160" y="650" width="1280" height="170" rx="18" fill="#fff" stroke="#b9cfe3" stroke-width="2"/></g>
<text x="200" y="687" class="pt">Infrastructure &amp; Delivery</text><g transform="translate(220 716)"><rect width="230" height="66" rx="14" fill="#25374a"/><text x="115" y="40" text-anchor="middle" class="support">GitHub Repository</text></g><g transform="translate(530 716)"><rect width="230" height="66" rx="14" fill="#3557cc"/><text x="115" y="40" text-anchor="middle" class="support">AWS SAM</text></g><g transform="translate(840 716)"><rect width="230" height="66" rx="14" fill="#f07b13"/><text x="115" y="40" text-anchor="middle" class="support">Deploy to AWS</text></g><g transform="translate(1150 716)"><rect width="230" height="66" rx="14" fill="#0a9c88"/><text x="115" y="40" text-anchor="middle" class="support">CloudWatch</text></g><path class="arrow" d="M450 749H520"/><path class="arrow" d="M760 749H830"/><path class="arrow" d="M1070 749H1140"/>
<rect x="160" y="848" width="1280" height="42" rx="12" fill="#0b2d50"/><text x="800" y="875" text-anchor="middle" class="foot">Implemented core path: Browser → API Gateway → Lambda → DynamoDB, with IAM and CloudWatch. S3/CloudFront frontend hosting is shown as an optional production extension.</text>
</svg>