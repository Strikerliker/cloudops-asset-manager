<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
<title id="title">CloudOps Asset Manager – Serverless AWS CRUD Architecture</title>
<desc id="desc">AWS serverless asset-management architecture showing users, optional CloudFront and S3 frontend hosting, API Gateway, Lambda CRUD handlers, DynamoDB, IAM, CloudWatch, AWS SAM and GitHub Actions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061522"/><stop offset="1" stop-color="#02101b"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b243a"/><stop offset="1" stop-color="#071a2b"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67baff"/></marker>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#f5fbff}.m{font-family:Arial,Helvetica,sans-serif;fill:#a7c4dc}.h{font-weight:700}
    .panel{fill:url(#panel);stroke:#244f70;stroke-width:1.6}.soft{fill:#0a2032;stroke:#315e80;stroke-width:1.4}
    .line{stroke:#67baff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6c96b9;stroke-width:2.2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    .small{font-size:14px}.tiny{font-size:12px}.cap{font-size:13px;letter-spacing:2px;fill:#72bfff}.svcname{font-size:17px;font-weight:700}
  </style>
</defs>

<rect width="1500" height="920" rx="22" fill="url(#bg)"/>
<rect x="22" y="22" width="1456" height="876" rx="22" fill="none" stroke="#173d58" stroke-width="2"/>

<text x="750" y="68" text-anchor="middle" class="t h" font-size="40">CloudOps Asset Manager – Serverless AWS CRUD Architecture</text>
<text x="750" y="99" text-anchor="middle" class="m" font-size="18">Secure • Scalable • Serverless • Asset Tracking</text>
<text x="750" y="125" text-anchor="middle" class="cap">CREATE • READ • UPDATE • DELETE</text>

<!-- Users -->
<g transform="translate(50 175)">
  <rect width="200" height="310" rx="16" class="panel" filter="url(#shadow)"/>
  <text x="100" y="34" text-anchor="middle" class="t h" font-size="19">Users</text>
  <circle cx="74" cy="105" r="23" fill="#2f6cab"/><circle cx="126" cy="105" r="23" fill="#2f6cab"/><circle cx="100" cy="82" r="25" fill="#386fa9"/>
  <text x="100" y="153" text-anchor="middle" class="t h" font-size="16">Users / Admins</text>
  <text x="100" y="177" text-anchor="middle" class="m small">Access the app</text>
  <rect x="52" y="208" width="96" height="62" rx="6" fill="none" stroke="#6fbaff" stroke-width="4"/>
  <path d="M42 281h116M66 270l-8 11m76-11 8 11" stroke="#6fbaff" stroke-width="4"/>
  <text x="100" y="302" text-anchor="middle" class="t h" font-size="15">Web Browser</text>
</g>

<!-- Frontend -->
<g transform="translate(300 175)">
  <rect width="235" height="310" rx="16" class="panel" filter="url(#shadow)"/>
  <text x="118" y="34" text-anchor="middle" class="t h" font-size="19">Frontend</text>
  <rect x="38" y="68" width="74" height="74" rx="10" fill="#8C4FFF"/>
  <path d="M57 111c0-20 31-20 31 0M49 105c0-13 19-18 27-9 7-17 34-8 34 10 11 2 13 20 0 23H58c-13-1-14-21-1-24z" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="126" y="91" class="t h" font-size="15">Amazon CloudFront</text><text x="126" y="112" class="m tiny">Optional CDN</text>
  <rect x="38" y="184" width="74" height="74" rx="10" fill="#7AA116"/>
  <ellipse cx="75" cy="204" rx="21" ry="8" fill="none" stroke="#fff" stroke-width="3"/><path d="M54 204v34c0 10 42 10 42 0v-34" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="126" y="207" class="t h" font-size="15">Amazon S3</text><text x="126" y="228" class="m tiny">Static web UI</text>
  <path d="M75 142v42" class="line"/>
</g>

<!-- API and compute -->
<g transform="translate(590 175)">
  <rect width="330" height="310" rx="16" class="panel" filter="url(#shadow)"/>
  <text x="165" y="34" text-anchor="middle" class="t h" font-size="19">API &amp; Compute</text>
  <rect x="32" y="68" width="78" height="78" rx="11" fill="#8C4FFF"/>
  <path d="M53 90h36v34H53zM45 101h8m36 0h8m-44 23h36" stroke="#fff" stroke-width="3.6" fill="none"/>
  <text x="126" y="91" class="t h" font-size="15">Amazon API Gateway</text><text x="126" y="112" class="m tiny">REST API / HTTPS</text>

  <rect x="222" y="68" width="78" height="78" rx="11" fill="#ED7100"/>
  <path d="M240 131l17-39 14 29h14l-22 13-9-14-7 14z" fill="none" stroke="#fff" stroke-width="4"/>
  <text x="261" y="167" text-anchor="middle" class="t h" font-size="15">AWS Lambda</text>
  <text x="261" y="188" text-anchor="middle" class="m tiny">CRUD handlers</text>
  <path d="M110 107h112" class="line"/>

  <rect x="35" y="218" width="260" height="70" rx="10" class="soft"/>
  <text x="54" y="243" class="t h small">CREATE</text><text x="115" y="243" class="m tiny">POST /assets</text>
  <text x="54" y="264" class="t h small">READ</text><text x="115" y="264" class="m tiny">GET /assets</text>
  <text x="178" y="243" class="t h small">UPDATE</text><text x="243" y="243" class="m tiny">PUT /assets/{id}</text>
  <text x="178" y="264" class="t h small">DELETE</text><text x="243" y="264" class="m tiny">DELETE /assets/{id}</text>
</g>

<!-- Data -->
<g transform="translate(975 175)">
  <rect width="220" height="310" rx="16" class="panel" filter="url(#shadow)"/>
  <text x="110" y="34" text-anchor="middle" class="t h" font-size="19">Data &amp; Storage</text>
  <rect x="72" y="68" width="76" height="76" rx="11" fill="#3868E8"/>
  <ellipse cx="110" cy="88" rx="21" ry="8" fill="none" stroke="#fff" stroke-width="3"/><path d="M89 88v36c0 10 42 10 42 0V88M89 103c0 10 42 10 42 0M89 117c0 10 42 10 42 0" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="110" y="168" text-anchor="middle" class="t h" font-size="16">Amazon DynamoDB</text><text x="110" y="190" text-anchor="middle" class="m tiny">Asset inventory</text>
  <rect x="72" y="216" width="76" height="76" rx="11" fill="#7AA116"/>
  <ellipse cx="110" cy="236" rx="21" ry="8" fill="none" stroke="#fff" stroke-width="3"/><path d="M89 236v35c0 10 42 10 42 0v-35" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="160" y="243" class="m tiny">Optional</text><text x="160" y="261" class="m tiny">attachments</text>
</g>

<!-- Security/observability -->
<g transform="translate(1245 175)">
  <rect width="205" height="310" rx="16" class="panel" filter="url(#shadow)"/>
  <text x="103" y="34" text-anchor="middle" class="t h" font-size="18">Security / Ops</text>
  <rect x="64" y="68" width="76" height="76" rx="11" fill="#D82B78"/>
  <path d="M80 125l13-15 12 7 20-29M79 132h47" stroke="#fff" stroke-width="3.5" fill="none"/>
  <text x="103" y="169" text-anchor="middle" class="t h" font-size="15">CloudWatch</text><text x="103" y="190" text-anchor="middle" class="m tiny">Logs &amp; metrics</text>
  <rect x="64" y="216" width="76" height="76" rx="11" fill="#DD344C"/>
  <path d="M83 248h38v30H83zM90 248v-11c0-17 24-17 24 0v11" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="103" y="306" text-anchor="middle" class="t h" font-size="15">AWS IAM</text>
</g>

<!-- main connections -->
<path d="M250 330H300" class="line"/>
<path d="M535 330H590" class="line"/>
<path d="M920 330H975" class="line"/>
<path d="M1195 330H1245" class="line"/>

<!-- deployment lane -->
<rect x="105" y="555" width="1290" height="210" rx="18" class="panel"/>
<text x="750" y="590" text-anchor="middle" class="cap">DEVELOPMENT &amp; DEPLOYMENT</text>

<g transform="translate(170 620)">
  <circle cx="42" cy="42" r="39" fill="#151515"/><text x="42" y="49" text-anchor="middle" class="t h" font-size="18">GH</text>
  <text x="94" y="36" class="t h" font-size="16">GitHub</text><text x="94" y="57" class="m tiny">Source &amp; pull requests</text>
</g>

<path d="M365 662H455" class="line"/>

<g transform="translate(470 620)">
  <circle cx="42" cy="42" r="39" fill="#2F80ED"/><text x="42" y="48" text-anchor="middle" class="t h" font-size="14">CI/CD</text>
  <text x="94" y="36" class="t h" font-size="16">GitHub Actions</text><text x="94" y="57" class="m tiny">Validate &amp; deploy</text>
</g>

<path d="M675 662H765" class="line"/>

<g transform="translate(785 620)">
  <rect x="0" y="0" width="82" height="82" rx="12" fill="#ED7100"/>
  <path d="M17 60h48V25H17zM25 20h32M25 68h32" stroke="#fff" stroke-width="3" fill="none"/>
  <text x="98" y="35" class="t h" font-size="16">AWS SAM</text><text x="98" y="56" class="m tiny">Infrastructure as code</text>
</g>

<path d="M1062 662H1152" class="line"/>

<g transform="translate(1168 620)">
  <rect x="0" y="0" width="82" height="82" rx="12" fill="#232F3E"/>
  <text x="41" y="49" text-anchor="middle" class="t h" font-size="23">AWS</text>
  <path d="M18 59c17 8 33 7 49 0" stroke="#FF9900" stroke-width="3" fill="none"/>
  <text x="98" y="35" class="t h" font-size="16">AWS Cloud</text><text x="98" y="56" class="m tiny">Serverless deployment</text>
</g>

<!-- deployment arrows to app -->
<path d="M870 620V520H755V485" class="dash"/>
<text x="880" y="535" class="m tiny">Deploy API + Lambda</text>
<path d="M1220 620V520H418V485" class="dash"/>
<text x="1050" y="535" class="m tiny">Optional frontend deployment</text>

<!-- footer -->
<rect x="105" y="805" width="1290" height="58" rx="13" fill="#08263e" stroke="#2f6e9c"/>
<text x="132" y="841" class="t h" font-size="16">Core implemented path:</text>
<text x="315" y="841" class="m small">Browser → API Gateway → Lambda → DynamoDB, with IAM and CloudWatch. S3/CloudFront are optional production frontend hosting.</text>
</svg>